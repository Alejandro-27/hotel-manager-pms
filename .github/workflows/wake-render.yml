name: Wake Render backend

on:
  schedule:
    # Render duerme los servicios web gratis tras 15 min de inactividad;
    # un ping cada 14 min los mantiene despiertos.
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar backend de Render
        run: |
          url="https://olimphestia.onrender.com"
          code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 "$url" || true)
          echo "backend -> $code"
          # Cualquier respuesta HTTP (2xx, 3xx, 4xx, 5xx) prueba que el servidor
          # esta despierto. Solo fallamos si no hubo conexion (curl != 0).
          test -n "$code"
